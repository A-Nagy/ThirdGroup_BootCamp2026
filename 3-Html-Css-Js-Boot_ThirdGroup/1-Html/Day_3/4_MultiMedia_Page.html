<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiMedia</title>
</head>
<body>
    <header>
        <h1>Multimedia Page</h1>
    </header>
    <main>
        <section>
            <h2>Image</h2>
            <img src="https://fastly.picsum.photos/id/1065/300/200.jpg?hmac=znixKcDX1Ou6rY0EYrczUpfu64rFKBrkiHlNKBhx2Kw" alt="صوره توضيحية" >
        </section>
        <section>
            <h2>Vedio</h2>
            <video width="320" height="240" controls>
               <source src="FunCode.mp4" type="video/mp4">
            </video>
        </section>
        <section>
            <h2>Audio</h2>
            <audio src="Sample.mp3" controls></audio>

        </section>
        <section>
            <iframe src="https://www.abadnet.com.sa/" frameborder="0" width="100%" height="400"></iframe>
        </section>
    </main>
    <footer>
        <p>    جميع الحقوق   </p>
    </footer>
</body>
</html>
