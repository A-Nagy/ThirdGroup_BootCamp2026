<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>images</title>
      <link  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container mt-3">
        <h2>Rounded Courners</h2>
        <img src="paris.jpg" alt="Image"  class="rounded" height="236" width="304">
    </div>
     <div class="container mt-3">
        <h2>Rounded-circle</h2>
        <img src="newyork.jpg" alt="Image" class="rounded-circle" height="236" width="304">
    </div>
    <div class="container mt-3">
        <h2>Thumbnail Image</h2>
        <img src="sanfran.jpg" alt="Image" class="img-thumbnail" height="236" width="304">
    </div>
</body>
</html>
