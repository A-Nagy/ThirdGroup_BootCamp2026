<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Tables</title>
    <link rel="stylesheet" href="basictable.css">
</head>
<body>
    <h1>Table with  Marge Cells</h1>
    <table border="1" >
        <tr>
            <th>Name</th>
            <th colspan="2"> Grades</th>
          
        </tr>
         <tr>
            <td>Samar</td>
            <td>Math</td>
            <td>95</td>
        </tr>
         <tr>
            <td rowspan="2">AbdElrahman</td>
            <td>Math</td>
            <td>95</td>
        </tr>
         <tr>
            <td>Programming</td>
            <td>100</td>
        </tr>
    </table>
</body>
</html>
