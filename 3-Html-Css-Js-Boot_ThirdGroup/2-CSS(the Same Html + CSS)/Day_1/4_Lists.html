<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lists</title>
            <link rel="stylesheet" href="style1.css">

</head>
<body>
       <h1>قائمة مرتبة</h1>
       <ol>
         <li>HTML</li>
         <li>CSS</li>
         <li>JS</li>
       </ol>

        <h2>قائمة غير مرتبة</h2>
        <ul>
         <li>VS Code </li>
         <li>Git</li>
         <li>Browser</li>
       </ul>

        <h2>قائمة وصفية</h2>
       <dl>

            <dt><b>HTML</b></dt>
            <dd>لغة الترميز لصفحات الويب</dd>
        
            <dt><strong>CSS</strong></dt>
            <dd>لغة تنسيق  لصفحات الويب</dd>
        
        </dl>
</body>
</html>
