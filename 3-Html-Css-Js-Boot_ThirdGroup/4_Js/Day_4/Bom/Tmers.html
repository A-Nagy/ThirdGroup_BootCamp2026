<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="timeoutMsg"></p>
    <p id="intervalMsg"></p>

    <script>
    // ✅ يظهر رسالة بعد 3 ثواني
    setTimeout(() => {
      document.getElementById("timeoutMsg").innerText = "تم تنفيذ setTimeout بعد 5 ثواني";
    }, 5000);

    // ✅ يعد الأرقام كل ثانية
    let count = 0;
    setInterval(() => {
      document.getElementById("intervalMsg").innerText = `عدد الثواني: ${++count}`;
    }, 1000);
    </script>
</body>
</html>
