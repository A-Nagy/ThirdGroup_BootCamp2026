<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card
        {
            border: 1px solid #CCC;
            padding: 15px;
            margin: 10px;
            border-radius: 5px;
            background-color: #f2f1f1;
        }
    </style>
</head>
<body>
    <div>
        <h2>Fill Data From Array </h2>
        <section id="TeamSection">
        
        </section>
        <script>
    const team = [
      { name: "Ali" , job:"Developer", city: "Riyadh" },
      { name: "Sara", job:"Designer" , city: "Jeddah" },
      { name: "Omar", job:"Manager"  , city: "Dammam" },
      { name: "Lina", job:"Engineer" , city: "Makkah" }
    ];

    const seco = document.getElementById("TeamSection"); 
    team.forEach(member=>{
        const card = document.createElement("div");
        card.className="card";
        card.innerHTML=`  <h3>${member.name}</h3>
                          <p>${member.job}</p>
                          <p>${member.city}</p>`;
        seco.appendChild(card);                  
    });



        </script>
   
    </div>
   
    <div>
        <h2>Fill Data From Api </h2>
        <button onclick="LoadData()">Load </button>
        <section id="TeamSectionApi"></section>
 <script>
   async function LoadData()
   {
    const response = await fetch("https://jsonplaceholder.typicode.com/users");
    const teams = await response.json();
    const apiseco = document.getElementById("TeamSectionApi");
    apiseco.innerHTML="";
    teams.forEach(memberapi=>
    {
  const card1 = document.createElement("div");
        card1.className="card";
        card1.innerHTML=` <h3>${memberapi.name}</h3>
                          <p>${memberapi.email}</p>
                          <p>${memberapi.address.city}</p>`;
        apiseco.appendChild(card1);                  

    });

   }
 </script>
    </div>
    
</body>
</html>
